<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Visit — Emagon Eye Clinic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>👁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-slate-50">
<div id="site-header"></div>

<script src="app.js"></script>
<script src="components.js"></script>
<script>
  const session = EMAGON.requireAuth('doctor', 'doctor-login.html');
  if (session) {
    UI.renderDoctorPortal('dashboard', session);
    const main = document.getElementById('main');

    const params = new URLSearchParams(location.search);
    const apt = EMAGON.Appointments.byId(params.get('apt'));

    if (!apt) {
      main.innerHTML = `<div class="text-center py-16"><p class="text-slate-500">No appointment selected.</p><a href="doctor-dashboard.html" class="text-sky-700 font-semibold text-sm hover:underline mt-3 inline-block">Back to queue</a></div>`;
    } else {
      const history = EMAGON.Prescriptions.byPatient(apt.patientId);
      const pastAppts = EMAGON.Appointments.byPatient(apt.patientId).filter(a => a.id !== apt.id);
      let medCount = 0;

      main.innerHTML = `
        <a href="doctor-dashboard.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-sky-700 mb-5"><i data-lucide="arrow-left" style="width:15px;height:15px"></i>Back to queue</a>

        <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6 sm:p-7 mb-6 flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <span class="w-14 h-14 rounded-2xl bg-sky-100 text-sky-700 flex items-center justify-center text-lg font-bold">${apt.patientName.split(' ').map(w => w[0]).slice(0, 2).join('')}</span>
            <div>
              <h1 class="text-xl font-extrabold text-ink">${apt.patientName}</h1>
              <p class="text-sm text-slate-500">${apt.service} &middot; ${EMAGON.formatDate(apt.date)}, ${EMAGON.formatTime(apt.time)}</p>
            </div>
          </div>
          <span class="pill" style="background:#E0F2FE;color:#0369A1"><span class="pill-dot" style="background:#0369A1"></span>${apt.status}</span>
        </div>

        <div class="grid lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 space-y-6">
            <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6 sm:p-7">
              <h2 class="font-semibold text-ink mb-4 flex items-center gap-2"><i data-lucide="clipboard-list" class="text-sky-500" style="width:18px;height:18px"></i>New Prescription / EMR Entry</h2>
              <form id="emr-form" class="space-y-5">
                <div>
                  <label for="emr-history" class="block text-sm font-medium text-ink mb-1.5">Patient history / presenting complaint</label>
                  <textarea id="emr-history" rows="2" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-100 outline-none" placeholder="e.g. Blurred distance vision for 3 weeks, no prior eye surgery"></textarea>
                </div>
                <div>
                  <label for="emr-diagnosis" class="block text-sm font-medium text-ink mb-1.5">Diagnosis</label>
                  <textarea id="emr-diagnosis" required rows="2" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-100 outline-none" placeholder="e.g. Moderate myopia, both eyes"></textarea>
                </div>

                <div>
                  <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-medium text-ink">Medication</label>
                    <button type="button" id="add-med" class="text-xs font-semibold text-sky-700 flex items-center gap-1"><i data-lucide="plus" style="width:13px;height:13px"></i>Add medication</button>
                  </div>
                  <div id="med-rows" class="space-y-3"></div>
                </div>

                <div>
                  <label for="emr-notes" class="block text-sm font-medium text-ink mb-1.5">Doctor's notes</label>
                  <textarea id="emr-notes" rows="2" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-100 outline-none" placeholder="Follow-up instructions, referrals, etc."></textarea>
                </div>

                <div>
                  <label for="emr-scan" class="block text-sm font-medium text-ink mb-1.5">Upload scan / imaging <span class="text-slate-400 font-normal">(optional)</span></label>
                  <input id="emr-scan" type="file" accept="image/*,.pdf" class="w-full text-sm rounded-2xl border border-dashed border-slate-300 px-4 py-3 file:mr-3 file:rounded-full file:border-0 file:bg-sky-100 file:text-sky-700 file:px-3 file:py-1.5 file:text-xs file:font-semibold">
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                  <button type="submit" class="flex-1 inline-flex items-center justify-center gap-2 bg-sky-500 hover:bg-sky-600 text-white font-semibold px-6 py-3 rounded-2xl shadow-card">
                    <i data-lucide="check" style="width:16px;height:16px"></i>Save &amp; Complete Visit
                  </button>
                </div>
              </form>
            </div>
          </div>

          <div class="space-y-6">
            <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6">
              <h3 class="font-semibold text-ink text-sm mb-3">Visit history</h3>
              ${pastAppts.length === 0 ? `<p class="text-xs text-slate-400">No previous visits on record.</p>` : `
                <ul class="space-y-2.5">
                  ${pastAppts.slice(0, 5).map(a => `<li class="text-xs text-slate-500 flex justify-between"><span>${a.service}</span><span class="text-slate-400">${EMAGON.formatDate(a.date)}</span></li>`).join('')}
                </ul>`}
            </div>
            <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6">
              <h3 class="font-semibold text-ink text-sm mb-3">Previous prescriptions</h3>
              ${history.length === 0 ? `<p class="text-xs text-slate-400">No prescriptions on record.</p>` : `
                <ul class="space-y-3">
                  ${history.map(r => `<li class="text-xs"><p class="font-medium text-ink">${r.diagnosis}</p><p class="text-slate-400 mt-0.5">${r.doctorName} &middot; ${EMAGON.formatDate(r.date)}</p></li>`).join('')}
                </ul>`}
            </div>
          </div>
        </div>
      `;

      const medRows = document.getElementById('med-rows');
      function addMedRow() {
        medCount++;
        const row = document.createElement('div');
        row.className = 'grid grid-cols-[1fr_1fr_1fr_auto] gap-2 items-center';
        row.innerHTML = `
          <input placeholder="Medication" class="med-name rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-sky-400">
          <input placeholder="Dosage" class="med-dosage rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-sky-400">
          <input placeholder="Duration" class="med-duration rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-sky-400">
          <button type="button" class="remove-med text-slate-400 hover:text-red-500 p-1"><i data-lucide="trash-2" style="width:15px;height:15px"></i></button>`;
        row.querySelector('.remove-med').addEventListener('click', () => row.remove());
        medRows.appendChild(row);
        EMAGON.initIcons();
      }
      document.getElementById('add-med').addEventListener('click', addMedRow);
      addMedRow();

      document.getElementById('emr-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const diagnosis = document.getElementById('emr-diagnosis').value.trim();
        const historyText = document.getElementById('emr-history').value.trim();
        const notes = document.getElementById('emr-notes').value.trim();
        const scanFile = document.getElementById('emr-scan').files[0];
        const medications = [...medRows.querySelectorAll(':scope > div')].map(row => ({
          name: row.querySelector('.med-name').value.trim(),
          dosage: row.querySelector('.med-dosage').value.trim(),
          duration: row.querySelector('.med-duration').value.trim()
        })).filter(m => m.name);

        const fullDiagnosis = historyText ? `${diagnosis} (History: ${historyText})` : diagnosis;

        EMAGON.Prescriptions.add({
          patientId: apt.patientId,
          doctorId: session.id,
          doctorName: session.name,
          diagnosis: fullDiagnosis,
          medications,
          notes,
          scanName: scanFile ? scanFile.name : ''
        });
        EMAGON.Appointments.updateStatus(apt.id, 'Completed');
        EMAGON.toast('Visit saved. Prescription now visible to patient.', 'success');
        setTimeout(() => { location.href = 'doctor-dashboard.html'; }, 900);
      });
    }
    EMAGON.initIcons();
  }
</script>
</body>
</html>
