<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Login — Emagon Eye Clinic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>👁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="images.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-sky-50 min-h-screen flex items-center justify-center px-4 py-12">

<div class="w-full max-w-md">
  <a href="index.html" class="flex items-center justify-center gap-3 mb-8">
    <span class="w-11 h-11 rounded-2xl bg-sky-500 text-white shadow-card flex items-center justify-center"><i data-lucide="eye" style="width:22px;height:22px"></i></span>
    <span class="font-semibold text-ink">Emagon Eye Clinic</span>
  </a>

  <div class="bg-white rounded-3xl shadow-soft p-8 sm:p-9">
    <h1 class="text-2xl font-extrabold text-ink text-center">Patient Portal</h1>
    <p class="text-sm text-slate-500 text-center mt-2 mb-7">Enter the email you used when booking to view your dashboard.</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="pl-email" class="block text-sm font-medium text-ink mb-1.5">Email address</label>
        <input id="pl-email" required type="email" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-100 outline-none" placeholder="you@example.com">
      </div>
      <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-sky-500 hover:bg-sky-600 text-white font-semibold px-7 py-3.5 rounded-2xl shadow-card transition-colors">
        Continue <i data-lucide="arrow-right" style="width:16px;height:16px"></i>
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <span class="h-px bg-slate-100 flex-1"></span>
      <span class="text-xs text-slate-400">or try the demo account</span>
      <span class="h-px bg-slate-100 flex-1"></span>
    </div>
    <button id="demo-btn" class="w-full flex items-center gap-3 border border-slate-200 hover:border-sky-300 hover:bg-sky-50 rounded-2xl px-4 py-3 text-left transition-colors">
      <span class="w-10 h-10 rounded-full bg-sky-500 text-white flex items-center justify-center text-sm font-semibold shrink-0">BY</span>
      <span>
        <span class="block text-sm font-semibold text-ink">Bilikisu Yusuf</span>
        <span class="block text-xs text-slate-500">Demo patient with existing history</span>
      </span>
    </button>

    <p class="text-sm text-center text-slate-500 mt-7">New here? <a href="book.html" class="text-sky-700 font-semibold hover:underline">Book an appointment</a> to create your account.</p>
  </div>
  <p class="text-center text-xs text-slate-400 mt-6">
    <a href="doctor-login.html" class="hover:text-slate-600">Staff Login</a> &middot; <a href="admin-login.html" class="hover:text-slate-600">Admin Login</a> &middot; <a href="index.html" class="hover:text-slate-600">Back to site</a>
  </p>
</div>

<script src="app.js"></script>
<script>
  EMAGON.initIcons();

  function enterAs(patient) {
    EMAGON.login('patient', patient.name, patient.id);
    location.href = 'patient-dashboard.html';
  }

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('pl-email').value.trim();
    const patient = EMAGON.Patients.byEmail(email);
    if (patient) {
      enterAs(patient);
    } else {
      EMAGON.toast('No patient found with that email. Please book an appointment first.', 'error');
    }
  });

  document.getElementById('demo-btn').addEventListener('click', () => {
    const patient = EMAGON.Patients.byId('pat-demo-001');
    if (patient) enterAs(patient);
  });
</script>
</body>
</html>
