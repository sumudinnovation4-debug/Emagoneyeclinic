<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Queue — Emagon Eye Clinic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>👁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-slate-50">
<div id="site-header"></div>

<script src="app.js"></script>
<script src="components.js"></script>
<script>
  const session = EMAGON.requireAuth('doctor', 'doctor-login.html');
  if (session) {
    UI.renderDoctorPortal('dashboard', session);
    const main = document.getElementById('main');

    function statusPill(status) {
      const map = { Pending: ['#B45309', '#FEF3C7'], Confirmed: ['#0369A1', '#E0F2FE'], Completed: ['#15803D', '#DCFCE7'], Cancelled: ['#B91C1C', '#FEE2E2'] };
      const [c, bg] = map[status] || ['#334155', '#F1F5F9'];
      return `<span class="pill" style="background:${bg};color:${c}"><span class="pill-dot" style="background:${c}"></span>${status}</span>`;
    }

    function render() {
      const today = EMAGON.Appointments.byDoctor(session.id).filter(a => a.date === new Date().toISOString().slice(0, 10)).sort((a, b) => a.time.localeCompare(b.time));
      const waiting = today.filter(a => a.status === 'Pending' || a.status === 'Confirmed');
      const done = today.filter(a => a.status === 'Completed');

      main.innerHTML = `
        <div class="mb-6">
          <h1 class="text-2xl font-extrabold text-ink tracking-tight">Today's Queue</h1>
          <p class="text-slate-500 text-sm mt-1">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
        </div>

        <div class="grid sm:grid-cols-3 gap-5 mb-8">
          <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6">
            <span class="w-11 h-11 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center mb-4"><i data-lucide="users" style="width:20px;height:20px"></i></span>
            <p class="text-2xl font-extrabold text-ink">${today.length}</p><p class="text-sm text-slate-500 mt-1">Patients today</p>
          </div>
          <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6">
            <span class="w-11 h-11 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mb-4"><i data-lucide="clock" style="width:20px;height:20px"></i></span>
            <p class="text-2xl font-extrabold text-ink">${waiting.length}</p><p class="text-sm text-slate-500 mt-1">Waiting</p>
          </div>
          <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6">
            <span class="w-11 h-11 rounded-2xl bg-green-100 text-green-600 flex items-center justify-center mb-4"><i data-lucide="check-circle-2" style="width:20px;height:20px"></i></span>
            <p class="text-2xl font-extrabold text-ink">${done.length}</p><p class="text-sm text-slate-500 mt-1">Completed</p>
          </div>
        </div>

        <div class="rounded-3xl border border-slate-100 bg-white shadow-card overflow-hidden">
          ${today.length === 0 ? `<div class="p-10 text-center"><i data-lucide="calendar-check" class="text-slate-300 mx-auto mb-3" style="width:36px;height:36px"></i><p class="text-sm text-slate-500">No appointments scheduled for today.</p></div>` : `
          <div class="data-table-wrap"><table class="data-table">
            <thead><tr><th>Time</th><th>Patient</th><th>Reason for visit</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${today.map(a => `
                <tr>
                  <td class="whitespace-nowrap font-medium text-ink">${EMAGON.formatTime(a.time)}</td>
                  <td>${a.patientName}</td>
                  <td>${a.service}</td>
                  <td>${statusPill(a.status)}</td>
                  <td class="text-right whitespace-nowrap">
                    ${a.status !== 'Completed' && a.status !== 'Cancelled' ? `<a href="doctor-patient.html?apt=${a.id}" class="text-xs font-semibold bg-sky-500 hover:bg-sky-600 text-white rounded-full px-3.5 py-1.5">Start Visit</a>` : `<a href="doctor-patient.html?apt=${a.id}" class="text-xs font-semibold text-sky-700">View EMR</a>`}
                  </td>
                </tr>`).join('')}
            </tbody>
          </table></div>`}
        </div>
      `;
      EMAGON.initIcons();
    }
    render();
  }
</script>
</body>
</html>
