<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Prescriptions — Emagon Eye Clinic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>👁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-slate-50">
<div id="site-header"></div>

<script src="app.js"></script>
<script src="components.js"></script>
<script>
  const session = EMAGON.requireAuth('patient', 'patient-login.html');
  if (session) {
    UI.renderPatientPortal('prescriptions', session);
    const main = document.getElementById('main');
    const rx = EMAGON.Prescriptions.byPatient(session.id);

    main.innerHTML = `
      <div class="mb-6">
        <h1 class="text-2xl font-extrabold text-ink tracking-tight">My Prescriptions</h1>
        <p class="text-slate-500 text-sm mt-1">${rx.length} prescription${rx.length === 1 ? '' : 's'} on file, written by your doctors after each visit.</p>
      </div>
      <div class="space-y-5">
        ${rx.length === 0 ? `<div class="rounded-3xl border border-slate-100 bg-white shadow-card p-10 text-center"><i data-lucide="clipboard-list" class="text-slate-300 mx-auto mb-3" style="width:36px;height:36px"></i><p class="text-sm text-slate-500">No prescriptions yet. They'll appear here after your doctor writes one during a visit.</p></div>` :
        rx.map(r => `
          <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6 sm:p-7">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <p class="font-semibold text-ink">${r.doctorName}</p>
                <p class="text-xs text-slate-500 mt-0.5">${EMAGON.formatDate(r.date)}</p>
              </div>
              <button data-print="${r.id}" class="no-print inline-flex items-center gap-1.5 text-xs font-semibold text-sky-700 border border-sky-200 rounded-full px-3 py-1.5 hover:bg-sky-50"><i data-lucide="printer" style="width:13px;height:13px"></i>Print</button>
            </div>
            <p class="text-sm text-slate-600"><span class="font-medium text-ink">Diagnosis:</span> ${r.diagnosis}</p>
            ${r.medications && r.medications.length ? `
              <div class="mt-4">
                <p class="text-xs font-semibold uppercase text-slate-400 mb-2">Medication</p>
                <div class="space-y-2">
                  ${r.medications.map(m => `
                    <div class="flex items-center gap-3 bg-sky-50 rounded-2xl px-4 py-2.5">
                      <i data-lucide="pill" class="text-sky-500 shrink-0" style="width:16px;height:16px"></i>
                      <div class="text-sm"><span class="font-medium text-ink">${m.name}</span> <span class="text-slate-500">— ${m.dosage}, ${m.duration}</span></div>
                    </div>`).join('')}
                </div>
              </div>` : ''}
            ${r.notes ? `<p class="text-sm text-slate-500 mt-4"><span class="font-medium text-ink">Doctor's notes:</span> ${r.notes}</p>` : ''}
            ${r.scanName ? `<p class="text-sm text-slate-500 mt-3 flex items-center gap-1.5"><i data-lucide="paperclip" style="width:14px;height:14px"></i>Attached scan: ${r.scanName}</p>` : ''}
          </div>`).join('')}
      </div>
    `;
    main.querySelectorAll('[data-print]').forEach(b => b.addEventListener('click', () => window.print()));
    EMAGON.initIcons();
  }
</script>
</body>
</html>
