<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Emagon Eye Clinic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>👁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-slate-50">
<div id="site-header"></div>

<script src="app.js"></script>
<script src="components.js"></script>
<script>
  const session = EMAGON.requireAuth('doctor', 'doctor-login.html');
  if (session) {
    UI.renderDoctorPortal('calendar', session);
    const main = document.getElementById('main');

    let viewDate = new Date();
    viewDate.setDate(1);
    let selectedDate = new Date().toISOString().slice(0, 10);

    function pad(n) { return String(n).padStart(2, '0'); }

    function render() {
      const year = viewDate.getFullYear(), month = viewDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthLabel = viewDate.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
      const myAppts = EMAGON.Appointments.byDoctor(session.id);
      const apptDates = new Set(myAppts.map(a => a.date));
      const todayStr = new Date().toISOString().slice(0, 10);

      let cells = '';
      for (let i = 0; i < firstDay; i++) cells += `<div></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${pad(month + 1)}-${pad(d)}`;
        const has = apptDates.has(dateStr);
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;
        cells += `<button data-date="${dateStr}" class="aspect-square rounded-2xl flex flex-col items-center justify-center text-sm relative transition-colors
          ${isSelected ? 'bg-sky-500 text-white font-semibold' : isToday ? 'bg-sky-50 text-sky-700 font-semibold' : 'hover:bg-slate-50 text-ink'}">
          ${d}
          ${has ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-sky-500'} mt-0.5"></span>` : ''}
        </button>`;
      }

      const dayAppts = myAppts.filter(a => a.date === selectedDate).sort((a, b) => a.time.localeCompare(b.time));

      main.innerHTML = `
        <div class="mb-6">
          <h1 class="text-2xl font-extrabold text-ink tracking-tight">Calendar</h1>
          <p class="text-slate-500 text-sm mt-1">All your scheduled appointments at a glance.</p>
        </div>
        <div class="grid lg:grid-cols-[1fr_360px] gap-6 items-start">
          <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6">
            <div class="flex items-center justify-between mb-5">
              <button id="prev-month" class="p-2 rounded-full hover:bg-slate-100"><i data-lucide="chevron-left" style="width:18px;height:18px"></i></button>
              <h2 class="font-semibold text-ink">${monthLabel}</h2>
              <button id="next-month" class="p-2 rounded-full hover:bg-slate-100"><i data-lucide="chevron-right" style="width:18px;height:18px"></i></button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-2">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="grid grid-cols-7 gap-1">${cells}</div>
          </div>
          <div class="rounded-3xl border border-slate-100 bg-white shadow-card p-6">
            <h3 class="font-semibold text-ink mb-4">${EMAGON.formatDate(selectedDate)}</h3>
            ${dayAppts.length === 0 ? `<p class="text-sm text-slate-400">No appointments on this day.</p>` : `
              <div class="space-y-3">
                ${dayAppts.map(a => `
                  <div class="rounded-2xl border border-slate-100 p-3.5">
                    <p class="text-sm font-medium text-ink">${EMAGON.formatTime(a.time)} — ${a.patientName}</p>
                    <p class="text-xs text-slate-500 mt-0.5">${a.service}</p>
                  </div>`).join('')}
              </div>`}
          </div>
        </div>
      `;

      document.getElementById('prev-month').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() - 1); render(); });
      document.getElementById('next-month').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() + 1); render(); });
      main.querySelectorAll('[data-date]').forEach(b => b.addEventListener('click', () => { selectedDate = b.dataset.date; render(); }));
      EMAGON.initIcons();
    }
    render();
  }
</script>
</body>
</html>
