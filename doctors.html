<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Doctors — Emagon Eye Clinic</title>
<meta name="description" content="Meet the ophthalmologists and optometrists of Emagon Eye Clinic, Abuja.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>👁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

<div id="site-header"></div>

<main id="main">
  <section class="bg-sky-50">
    <div class="max-w-7xl mx-auto px-5 sm:px-8 pt-14 pb-16 lg:pt-20 lg:pb-20">
      <p class="text-sky-600 font-semibold text-sm mb-2">Our Team</p>
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-ink max-w-2xl">Specialists you can trust with your sight</h1>
      <p class="mt-5 text-lg text-slate-600 max-w-xl">Every doctor at Emagon is fellowship-trained, with a combined 40+ years of experience across surgical and medical ophthalmology.</p>
    </div>
  </section>

  <section class="max-w-7xl mx-auto px-5 sm:px-8 py-16 lg:py-20">
    <div id="doctors-list" class="grid md:grid-cols-2 gap-6"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="app.js"></script>
<script src="components.js"></script>
<script>
  UI.renderPublicHeader('doctors');
  UI.renderPublicFooter();

  const list = document.getElementById('doctors-list');
  EMAGON.Doctors.all().forEach(d => {
    const card = document.createElement('div');
    card.className = 'rounded-3xl border border-slate-100 bg-white shadow-card p-7 sm:p-8';
    card.innerHTML = `
      <div class="flex items-start gap-5">
        <span class="w-20 h-20 rounded-2xl text-white flex items-center justify-center text-2xl font-bold shrink-0" style="background:${d.photoBg}">${d.initials}</span>
        <div>
          <h3 class="font-semibold text-ink text-lg">${d.name}</h3>
          <p class="text-sky-600 text-sm font-medium mt-0.5">${d.title}</p>
          <p class="text-slate-500 text-sm mt-0.5">${d.specialty}</p>
        </div>
      </div>
      <p class="text-sm text-slate-600 leading-relaxed mt-5">${d.bio}</p>
      <div class="flex items-center justify-between mt-6 pt-5 border-t border-slate-100">
        <p class="text-xs text-slate-500 flex items-center gap-1.5"><i data-lucide="calendar" style="width:14px;height:14px"></i>Available ${d.days}</p>
        <a href="book.html?doctor=${d.id}" class="text-sm font-semibold text-sky-700 hover:underline">Book with ${d.name.split(' ')[1]}</a>
      </div>`;
    list.appendChild(card);
  });
  EMAGON.initIcons();
</script>
</body>
</html>
