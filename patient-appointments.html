<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Appointments — Emagon Eye Clinic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>👁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-slate-50">
<div id="site-header"></div>

<script src="app.js"></script>
<script src="components.js"></script>
<script>
  const session = EMAGON.requireAuth('patient', 'patient-login.html');
  if (session) {
    UI.renderPatientPortal('appointments', session);
    const main = document.getElementById('main');

    function statusPill(status) {
      const map = { Pending: ['#B45309', '#FEF3C7'], Confirmed: ['#0369A1', '#E0F2FE'], Completed: ['#15803D', '#DCFCE7'], Cancelled: ['#B91C1C', '#FEE2E2'] };
      const [c, bg] = map[status] || ['#334155', '#F1F5F9'];
      return `<span class="pill" style="background:${bg};color:${c}"><span class="pill-dot" style="background:${c}"></span>${status}</span>`;
    }

    function render() {
      const appts = EMAGON.Appointments.byPatient(session.id).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
      main.innerHTML = `
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-extrabold text-ink tracking-tight">My Appointments</h1>
            <p class="text-slate-500 text-sm mt-1">${appts.length} total appointment${appts.length === 1 ? '' : 's'}</p>
          </div>
          <a href="book.html" class="hidden sm:inline-flex items-center gap-2 bg-sky-500 hover:bg-sky-600 text-white font-semibold px-5 py-2.5 rounded-2xl shadow-card transition-colors text-sm"><i data-lucide="plus" style="width:16px;height:16px"></i>New Appointment</a>
        </div>
        <div class="rounded-3xl border border-slate-100 bg-white shadow-card overflow-hidden">
          ${appts.length === 0 ? `<div class="p-10 text-center"><i data-lucide="calendar-x" class="text-slate-300 mx-auto mb-3" style="width:36px;height:36px"></i><p class="text-sm text-slate-500">You have no appointments yet.</p></div>` : `
          <div class="data-table-wrap"><table class="data-table">
            <thead><tr><th>Date &amp; time</th><th>Service</th><th>Doctor</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${appts.map(a => `
                <tr>
                  <td class="font-medium text-ink whitespace-nowrap">${EMAGON.formatDate(a.date)} <span class="text-slate-400 font-normal">${EMAGON.formatTime(a.time)}</span></td>
                  <td>${a.service}</td>
                  <td>${a.doctorName}</td>
                  <td>${statusPill(a.status)}</td>
                  <td class="text-right">
                    ${a.status === 'Pending' || a.status === 'Confirmed' ? `<button data-cancel="${a.id}" class="text-xs font-semibold text-red-600 hover:underline">Cancel</button>` : ''}
                  </td>
                </tr>`).join('')}
            </tbody>
          </table></div>`}
        </div>
        <a href="book.html" class="sm:hidden mt-5 flex items-center justify-center gap-2 bg-sky-500 hover:bg-sky-600 text-white font-semibold px-5 py-3 rounded-2xl shadow-card text-sm"><i data-lucide="plus" style="width:16px;height:16px"></i>New Appointment</a>
      `;
      main.querySelectorAll('[data-cancel]').forEach(btn => {
        btn.addEventListener('click', () => {
          EMAGON.Appointments.updateStatus(btn.dataset.cancel, 'Cancelled');
          EMAGON.toast('Appointment cancelled.', 'success');
          render();
        });
      });
      EMAGON.initIcons();
    }
    render();
  }
</script>
</body>
</html>
